name: Release Hex Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without the leading v, for example 0.4.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-hex-package
  cancel-in-progress: false

env:
  ELIXIR_VERSION: "1.19.5"
  KANSOKU_JIZOKU_SOURCE: "hex"
  OTP_VERSION: "28.4.1"

jobs:
  release:
    name: Release to GitHub and Hex.pm
    runs-on: ubuntu-latest
    environment: hex-publish

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Require explicit Kansoku release activation
        env:
          KANSOKU_RELEASES_ENABLED: ${{ vars.KANSOKU_RELEASES_ENABLED }}
        run: |
          if [ "$KANSOKU_RELEASES_ENABLED" != "true" ]; then
            echo "::error::Kansoku Hex releases are disabled until the coordinated cutover"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Elixir
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Validate requested version
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be SemVer without a leading v"
            exit 1
          fi

          tag_exists=false
          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            tag_exists=true
          fi

          release_exists=false
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "$release_exists" = "true" ] && [ "$tag_exists" != "true" ]; then
            echo "::error::GitHub release exists without its tag"
            exit 1
          fi

          hex_status="$(curl --silent --show-error --output /tmp/hex-release.json \
            --write-out '%{http_code}' \
            "https://hex.pm/api/packages/kansoku/releases/${RELEASE_VERSION}")"

          case "$hex_status" in
            200) hex_exists=true ;;
            404) hex_exists=false ;;
            *)
              echo "::error::Hex.pm release lookup returned HTTP ${hex_status}"
              exit 1
              ;;
          esac

          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"
          echo "hex_exists=${hex_exists}" >> "$GITHUB_OUTPUT"

      - name: Checkout existing release tag
        if: ${{ steps.release_state.outputs.tag_exists == 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git checkout "v${RELEASE_VERSION}"

      - name: Prepare release metadata
        if: ${{ steps.release_state.outputs.tag_exists != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          elixir scripts/kansoku_release_prep.exs "$RELEASE_VERSION" \
            --notes-file /tmp/kansoku-release-notes.md
          mix format

      - name: Recover release notes from existing tag
        if: ${{ steps.release_state.outputs.tag_exists == 'true' && steps.release_state.outputs.release_exists != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          elixir scripts/kansoku_release_prep.exs "$RELEASE_VERSION" \
            --notes-only \
            --notes-file /tmp/kansoku-release-notes.md

      - name: Verify release
        env:
          HEX_API_KEY: ${{ secrets.HEX_SECRET_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          TAG_EXISTS: ${{ steps.release_state.outputs.tag_exists }}
        run: |
          set -euo pipefail

          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::HEX_SECRET_KEY is not configured"
            exit 1
          fi

          mix deps.get

          package_version="$(elixir -e 'Mix.start(); Code.require_file("mix.exs"); Mix.Project.get!(); IO.write(Mix.Project.config()[:version])')"

          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::requested version ${RELEASE_VERSION} does not match mix.exs version ${package_version}"
            exit 1
          fi

          if [ "$TAG_EXISTS" != "true" ]; then
            mix precommit

            pushd examples/example_app
            MIX_ENV=test mix deps.get
            MIX_ENV=test mix format --check-formatted
            MIX_ENV=test mix compile --warnings-as-errors
            MIX_ENV=test mix test
            popd
          fi

          mix hex.publish --dry-run --yes
          mix hex.build --unpack --output /tmp/kansoku-hex-package

      - name: Commit release metadata
        if: ${{ steps.release_state.outputs.tag_exists != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.exs README.md CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::error::release metadata did not change"
            exit 1
          fi

          git commit \
            -m "chore: release ${RELEASE_VERSION}" \
            -m "Update Kansoku package metadata and changelog for ${RELEASE_VERSION}."

      - name: Tag and push release
        if: ${{ steps.release_state.outputs.tag_exists != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git tag -a "v${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          git push --atomic origin HEAD:main "v${RELEASE_VERSION}"

      - name: Create GitHub release
        if: ${{ steps.release_state.outputs.release_exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --notes-file /tmp/kansoku-release-notes.md

      - name: Publish package
        if: ${{ steps.release_state.outputs.hex_exists != 'true' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::HEX_SECRET_KEY is not configured"
            exit 1
          fi

          mix hex.publish --yes
