name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v5
    secrets: inherit
    with:
      audit_command: mix deps.audit
      docs_command: mix doctor --raise && mix docs -f html
      test_command: mix coveralls

  package-checks:
    name: Kansoku Package Checks
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kansoku_example_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check repository automation
        run: |
          bash .github/tests/discord_notifications_test.sh
          bash .github/tests/release_prep_test.sh

      - name: Setup Elixir
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Run package-specific quality gates
        run: |
          mix xref graph --format cycles --label compile-connected --fail-above 0
          mix brand.audit
          mix quality_gates

      - name: Install example dependencies
        working-directory: examples/example_app
        run: mix deps.get

      - name: Check example formatting
        working-directory: examples/example_app
        run: mix format --check-formatted

      - name: Compile example
        working-directory: examples/example_app
        run: mix compile --warnings-as-errors

      - name: Test example
        working-directory: examples/example_app
        run: mix test
